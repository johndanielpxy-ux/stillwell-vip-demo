services:
  - type: web
    name: stillwell-vip-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DEMO_MAX_REQUESTS
        value: 200
